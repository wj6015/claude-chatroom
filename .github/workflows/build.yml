name: Build-EXE-WebList-Network

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: x64

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==5.13.2
          pip install -r requirements.txt

      - name: Check runtime assets
        shell: pwsh
        run: |
          if (-not (Test-Path "main.py")) {
            Write-Error "main.py not found"
            exit 1
          }

          if (-not (Test-Path "Chrome-bin")) {
            Write-Error "Chrome-bin folder not found"
            exit 1
          }

          if (-not (Test-Path "chromedriver.exe")) {
            Write-Error "chromedriver.exe not found"
            exit 1
          }

      - name: Build EXE
        shell: pwsh
        run: |
          $appName = "Web列表数据采集工具_Network版"

          $args = @(
            '--onefile'
            '--windowed'
            '--name', $appName
            '--clean'
            '--noconfirm'
            '--hidden-import', 'pandas'
            '--hidden-import', 'openpyxl'
            '--hidden-import', 'selenium'
            'main.py'
          )

          pyinstaller @args

      - name: Prepare package
        shell: pwsh
        run: |
          $appName = "Web列表数据采集工具_Network版"

          New-Item -ItemType Directory -Force -Path "dist/package" | Out-Null

          Copy-Item "dist/$appName.exe" "dist/package/"
          Copy-Item "Chrome-bin" "dist/package/" -Recurse -Force
          Copy-Item "chromedriver.exe" "dist/package/" -Force

          @'
Web列表数据采集工具（Network版）
==============================

【文件清单】
- Web列表数据采集工具_Network版.exe
- Chrome-bin\
- chromedriver.exe

【运行说明】
1. 运行程序
2. 启动浏览器后，手工登录并打开目标列表页面
3. 先点击“清空Performance Log”
4. 再点击查询按钮并完整展示第一页数据
5. 最后点击“开始采集”

【注意】
- 该程序通过 Chrome + ChromeDriver + CDP Network 监听 queryTransPqList 响应
- 数据以 Network.getResponseBody 为准，不直接依赖页面 loading
- 翻页会等待页码变化和响应体可读
- 导出文件为 xlsx
'@ | Out-File -FilePath "dist/package/使用说明.txt" -Encoding UTF8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebListScraper-Network-Win64
          path: dist/package/
          retention-days: 30
