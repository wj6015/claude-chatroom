name: Build-EXE-ChargSitu-SGSBrowser-Pure-CDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: x64

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==5.13.2
          pip install -r requirements.txt

      - name: Check main.py
        shell: pwsh
        run: |
          if (-not (Test-Path "main.py")) {
            Write-Error "main.py not found"
            exit 1
          }

      - name: Build EXE
        shell: pwsh
        run: |
          $appName = "现货交割电量采集工具_国网浏览器CDP版"

          $args = @(
            '--onefile'
            '--windowed'
            '--name', $appName
            '--clean'
            '--noconfirm'
            '--hidden-import', 'pandas'
            '--hidden-import', 'openpyxl'
            '--hidden-import', 'websocket'
            '--hidden-import', 'websocket._core'
            '--hidden-import', 'websocket._exceptions'
            '--hidden-import', 'websocket._handshake'
            '--hidden-import', 'websocket._http'
            '--hidden-import', 'websocket._socket'
            '--hidden-import', 'websocket._ssl_compat'
            '--hidden-import', 'websocket._url'
            '--hidden-import', 'websocket._utils'
            'main.py'
          )

          pyinstaller @args

      - name: Prepare package
        shell: pwsh
        run: |
          $appName = "现货交割电量采集工具_国网浏览器CDP版"

          New-Item -ItemType Directory -Force -Path "dist/package" | Out-Null

          Copy-Item "dist/$appName.exe" "dist/package/"

          $readmeLines = @(
            "现货交割电量采集工具_国网浏览器CDP版"
            "=============================="
            ""
            "【文件清单】"
            "- 现货交割电量采集工具_国网浏览器CDP版.exe"
            ""
            "【运行说明】"
            "1. 将 exe 放在目标机器的程序目录中"
            "2. 确认目标机器已安装国网安全浏览器 SGSBrowser"
            "3. 程序通过 9222 CDP 端口监听 Network 响应"
            "4. 本版本不使用 selenium，不使用 chromedriver.exe"
            "5. 操作顺序：启动国网浏览器 -> 手工登录并打开目标页面 -> 清空Performance Log -> 手工查询第一页 -> 开始采集"
            ""
            "【注意】"
            "- 本版本不打包 SGSBrowser"
            "- 本版本不依赖 Chrome-bin / chromedriver.exe"
            "- 如目标机器安装路径不同，请同步修改 main.py 中的 SG_BROWSER_PATH"
            "- 导出文件为 xlsx"
          )

          $readmeLines -join "`r`n" | Out-File -FilePath "dist/package/使用说明.txt" -Encoding UTF8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChargSituScraper-SGSBrowser-Pure-CDP-Win64
          path: dist/package/
          retention-days: 30
